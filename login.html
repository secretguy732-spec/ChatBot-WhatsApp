<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — CombiChatBot-WattshApp</title>
  <link rel="stylesheet" href="style.css"/>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="../firebase/firebase-config.js"></script>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-container {
      width: 100%; max-width: 420px;
      padding: 24px;
      position: relative; z-index: 1;
    }
    .auth-logo {
      text-align: center; margin-bottom: 36px;
    }
    .auth-logo .logo-big {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-cyan));
      border-radius: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 2rem;
      box-shadow: 0 0 40px rgba(0,136,255,0.4);
      margin-bottom: 16px;
    }
    .auth-logo h1 { font-size: 1.4rem; margin-bottom: 4px; }
    .auth-logo p  { font-size: 0.88rem; color: var(--text-muted); }

    .auth-card { padding: 36px; }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    .divider-text {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0;
      color: var(--text-muted); font-size: 0.82rem;
    }
    .divider-text::before, .divider-text::after {
      content: '';
      flex: 1; height: 1px;
      background: var(--border-dim);
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-container">
    <div class="auth-logo">
      <div class="logo-big">🤖</div>
      <h1>Welcome back</h1>
      <p>Sign in to your CombiChatBot account</p>
    </div>

    <div class="card auth-card">
      <div id="error-msg" style="display:none;padding:12px 16px;background:rgba(255,59,92,0.1);border:1px solid rgba(255,59,92,0.3);border-radius:8px;color:var(--neon-red);font-size:0.88rem;margin-bottom:20px"></div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="you@business.com" autocomplete="email"/>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Enter your password" autocomplete="current-password"/>
      </div>

      <button id="login-btn" class="btn btn-primary" style="width:100%;margin-top:8px" onclick="handleLogin()">
        Sign In
      </button>

      <div class="divider-text">or</div>

      <a href="register.html" class="btn btn-secondary" style="width:100%;text-align:center">
        Create New Account
      </a>
    </div>

    <div class="auth-footer">
      <a href="index.html" style="color:var(--text-muted)">← Back to Home</a>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Redirect if already logged in
    window.addEventListener("auth:change", ({ detail: { user } }) => {
      if (user) window.location.href = "dashboard.html";
    });

    async function handleLogin() {
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn      = document.getElementById("login-btn");
      const errDiv   = document.getElementById("error-msg");

      if (!email || !password) {
        errDiv.textContent = "Please fill in all fields.";
        errDiv.style.display = "block";
        return;
      }

      setLoading(btn, true, "Signing in...");
      errDiv.style.display = "none";

      try {
        await login(email, password);
        // auth:change listener handles redirect
      } catch (err) {
        const msgs = {
          "auth/user-not-found":   "No account found with this email.",
          "auth/wrong-password":   "Incorrect password.",
          "auth/invalid-email":    "Invalid email address.",
          "auth/too-many-requests":"Too many attempts. Try again later.",
        };
        errDiv.textContent  = msgs[err.code] || err.message;
        errDiv.style.display = "block";
        setLoading(btn, false);
      }
    }

    // Allow Enter key
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleLogin();
    });
  </script>
</body>
</html>
